<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan & Buy</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        window.SUPABASE_URL = "{{ supabase_url }}";
        window.SUPABASE_KEY = "{{ supabase_key }}";
    </script>
</head>
<body>
    <div id="auth-overlay">
        <div class="auth-card">
            <h2>Willkommen</h2>
            <p>Bitte melde dich an, um deine Listen zu verwalten.</p>
            <input id="auth-email" type="email" placeholder="E-Mail" required>
            <input id="auth-password" type="password" placeholder="Passwort" required>
            <button onclick="signIn()">Anmelden</button>
            <button onclick="signUp()" class="btn-secondary">Account erstellen</button>
            <p id="auth-msg"></p>
        </div>
    </div>

    <nav class="sidebar">
        <h2>Plan & Buy</h2>
        <ul id="side-nav" class="project-nav"></ul>
        <button class="btn-new-project" onclick="addProject()">+ Neues Projekt</button>
        <button onclick="signOut()" class="btn-logout">Abmelden</button>
    </nav>

    <main class="content">
        <section id="dashboard">
            <div class="header">
                <h1>Meine Projekte</h1>
            </div>
            <div id="project-grid" class="grid"></div>
        </section>

        <section id="project-detail" style="display:none;">
            <div class="header">
                <h1 id="detail-title">Projektname</h1>
                <div class="actions">
                    <button onclick="showDashboard()" class="btn-back">&larr; Zurück</button>
                    <button onclick="shareCurrentProject()" class="btn-add">Teilen</button>
                </div>
            </div>
            
            <div class="lists-container">
                <div class="list-box">
                    <h3>✅ Aufgaben</h3>
                    <ul id="todo-list"></ul>
                    <div class="input-group">
                        <input type="text" id="todo-input" placeholder="Neue Aufgabe...">
                        <button class="btn-add" onclick="saveItem('todo')">Hinzufügen</button>
                    </div>
                </div>

                <div class="list-box">
                    <h3>🛒 Einkaufsliste</h3>
                    <ul id="res-list"></ul>
                    <div class="input-group">
                        <input type="text" id="res-input" placeholder="Artikel hinzufügen...">
                        <button class="btn-add" onclick="saveItem('resource')">Hinzufügen</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
